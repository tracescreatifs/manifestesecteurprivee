<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Manifeste, espace Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Jost:wght@400;500;600&family=Gelasio:ital,wght@0,400;0,500;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* Interface : papier, encre, eau profonde. Document : la charte de la proposition Word (vert, or, Georgia, Calibri). */
  --paper:#F7F3EA; --surface:#FFFFFF; --ink:#14212B; --muted:#5B6670; --line:#E3DCCD; --line-strong:#CFC6B3;
  --water:#1D4E5C; --water-soft:#E4EEF0; --clay:#B5653A; --clay-soft:#F6E7DB; --ok:#2F6B4F; --ok-soft:#E2EFE6; --danger:#A23B2A; --danger-soft:#F7E2DD;
  --doc-green:#0E4B3A; --doc-gold:#C2A14D; --doc-grey:#6A736E; --doc-line:#D9D3C2;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --doc-serif: Georgia, 'Gelasio', 'Times New Roman', serif;
  --doc-sans: Calibri, 'Carlito', 'Segoe UI', Arial, sans-serif;
  --r:8px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
svg.lucide{width:18px;height:18px;stroke-width:1.75;flex:none}
.btn-sm svg.lucide,.icon-btn.sm svg.lucide{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 14px;font-weight:500;background:var(--surface);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--water);border-color:var(--water);color:#fff}
.btn-primary:hover{background:#163f4b;border-color:#163f4b}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(20,33,43,.06);border-color:transparent}
.btn-sm{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.btn-wa:hover{background:#18633e;border-color:#18633e}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:rgba(20,33,43,.06);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.input,.textarea,.select{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:9px 12px}
.textarea{min-height:90px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--water);box-shadow:0 0 0 3px var(--water-soft)}
.err{color:var(--danger);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--water);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:#EFEAE0;color:var(--ink);white-space:nowrap}
.chip svg.lucide{width:14px;height:14px}
.chip-water{background:var(--water-soft);color:var(--water)}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-clay{background:var(--clay-soft);color:#8a4724}
.chip-grey{background:#EFEFED;color:var(--muted)}
.chip-danger{background:var(--danger-soft);color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.demo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 20px;background:var(--ink);color:#E9ECEE;font-size:14px}
.demo strong{font-family:var(--font-display);font-weight:500;font-size:16px;color:#fff}
.demo .sp{flex:1}
.demo label{display:inline-flex;gap:8px;align-items:center;color:#C9CFD3}
.demo select{border:1px solid #3a4853;border-radius:var(--r);background:#1d2d39;color:#fff;padding:6px 8px;font-size:14px}
.demo .btn{background:transparent;border-color:#3a4853;color:#E9ECEE}
.demo .btn:hover{border-color:#fff;color:#fff}
.demo .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#F7F3EA;color:var(--ink);font-weight:600}
.note{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);padding:7px 16px;border-bottom:1px solid var(--line);background:#EFEFED;text-align:center}

.wrap{max-width:1120px;margin:0 auto;padding:32px 20px 64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.panel h3{font-size:19px;display:flex;gap:10px;align-items:center}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li svg{color:var(--water);margin-top:2px}
.linkish{border:0;background:transparent;color:var(--water);font-weight:500;padding:2px 0;font-size:13.5px;display:inline-flex;gap:5px;align-items:center}
.linkish:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.shell{display:grid;grid-template-columns:228px 1fr;min-height:calc(100vh - 88px)}
.side{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;background:#F1F1EF}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);border:0;background:transparent;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav-item:hover{background:rgba(20,33,43,.05);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,43,.08)}
.nav-item .badge{margin-left:auto;font-size:12px;background:var(--clay-soft);color:#8a4724;border-radius:999px;padding:1px 8px}
.nav-item .badge.ok{background:var(--ok-soft);color:var(--ok)}
.main{padding:24px 28px 90px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.topbar .title{font-size:23px;max-width:34ch;margin-top:4px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--water);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.bottomnav{display:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:22px}
.page-head p{color:var(--muted);margin-top:4px;max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--water-soft);color:#173e49;margin-bottom:16px;font-size:14.5px}
.notice.clay{background:var(--clay-soft);color:#6d3818}
.notice.ok{background:var(--ok-soft);color:#214d39}
.notice.grey{background:#EFEFED;color:var(--ink)}
.notice svg{margin-top:2px}
.notice .grow{flex:1}

/* ===== Page A4 : unités en largeur de page (1cqw = 2,1 mm) ===== */
.a4-stack{display:grid;gap:22px;overflow-x:auto;padding:2px 2px 8px}
.a4-wrap{container-type:inline-size;width:100%;max-width:700px;margin:0 auto}
.z2 .a4-wrap{width:875px;max-width:none}
.z3 .a4-wrap{width:1050px;max-width:none}
.a4-page{position:relative;background:#fff;aspect-ratio:210/297;width:100%;padding:6.7cqw 10.5cqw 5.2cqw;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(20,33,43,.08),0 10px 30px rgba(20,33,43,.08);color:#1E2622;font-family:var(--doc-sans);font-size:1.6cqw;line-height:1.38}
.a4-page.editing{box-shadow:0 0 0 2px var(--water),0 10px 30px rgba(20,33,43,.08)}
.a4-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.a4-flow{display:block}
.a4-foot{display:flex;justify-content:space-between;gap:2cqw;font-size:1.15cqw;color:var(--doc-grey);padding-top:1.6cqw}
.d-kicker{text-align:center;font-size:1.25cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--doc-gold);font-weight:700;margin-bottom:1.6cqw}
.d-title{font-family:var(--doc-serif);color:var(--doc-green);font-size:3.55cqw;line-height:1.18;text-align:center;font-weight:400;margin:0}
.d-sub{text-align:center;color:var(--doc-grey);font-size:1.4cqw;margin-top:1.4cqw}
.d-rule{height:0;border-top:.22cqw solid var(--doc-gold);margin:2.2cqw 0 2.6cqw}
.a4-blk{position:relative;margin:0 0 1.15cqw;border-radius:2px}
.a4-blk.h{font-size:1.3cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--doc-gold);font-weight:700;margin:2.4cqw 0 1cqw}
.a4-blk.li{display:grid;grid-template-columns:2.6cqw 1fr;margin-bottom:.8cqw}
.a4-blk .num{font-weight:700;color:var(--doc-green)}
.a4-blk.accroche{font-family:var(--doc-serif);font-style:italic;color:var(--doc-green);font-size:2.25cqw;text-align:center;margin:2.6cqw 0 1.2cqw}
.a4-blk.mention{font-size:1.2cqw;color:var(--doc-grey);text-align:center}
.a4-blk .txt{margin:0;outline:none;min-height:1.3em;overflow-wrap:anywhere}
.a4-blk .txt strong{font-weight:700;color:#14201B}
.a4-blk.h .txt strong{color:inherit}
.a4-blk.is-sel{background:#F5F0E3;box-shadow:0 0 0 1cqw #F5F0E3}
.a4-blk .txt[contenteditable="true"]{cursor:text}
.a4-blk .txt[contenteditable="true"]:focus{background:#F1F7F8;box-shadow:0 0 0 .8cqw #F1F7F8}
.a4-blk .txt:empty::before{content:"Écrivez ici";color:#B9B2A3}
.blk-tools{position:absolute;top:-2px;right:-9.6cqw;display:flex;flex-direction:column;gap:2px;font-family:var(--font-body);font-size:13px;line-height:1;letter-spacing:0;text-transform:none;font-style:normal}
.cmt-btn{display:inline-flex;align-items:center;gap:3px;border:0;background:transparent;color:#A9A293;border-radius:6px;padding:4px 5px;font-size:12.5px;font-weight:500}
.cmt-btn:hover{background:rgba(20,33,43,.06);color:var(--ink)}
.cmt-btn.has{color:var(--clay);font-weight:600}
.cmt-btn svg.lucide{width:15px;height:15px}
.a4-blk:not(:hover):not(.is-sel) .cmt-btn:not(.has){opacity:.5}
.pageinfo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:0 0 6px}
.zoom{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:5px 10px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.zoom button:last-child{border-right:0}
.zoom button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pagebreak{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:-8px 0}
.pagebreak::before,.pagebreak::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}

/* Annexe */
.ann-title{font-family:var(--doc-serif);color:var(--doc-green);font-size:2.9cqw;margin-bottom:2.4cqw}
.ann-table{flex:1;display:grid;grid-template-columns:5% 24% 17% 26% 28%;border-top:.15cqw solid var(--doc-green)}
.ann-table > div{border-bottom:1px solid var(--doc-line);border-right:1px solid var(--doc-line);padding:.8cqw 1cqw;display:flex;align-items:center;min-width:0;font-size:1.35cqw;line-height:1.25}
.ann-table > div:nth-child(5n+1){border-left:1px solid var(--doc-line)}
.ann-table .th{font-size:1.05cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--doc-grey);font-weight:700;align-items:flex-end;padding-top:1.2cqw}
.ann-table .no{color:var(--doc-grey);align-items:flex-start}
.ann-table .nf strong{display:block;font-weight:700}
.ann-table .nf{display:block;padding-top:1.4cqw}
.ann-table .nf span{color:var(--doc-grey);font-size:1.2cqw}
.ann-table .sg{padding:.4cqw .8cqw}
.ann-table .sg .sigsvg{height:100%;width:100%}
.ann-table .ghost{border-color:transparent !important}
.sigsvg{display:block;width:100%}

/* Éditeur */
.texte-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.texte-grid.nopanel{grid-template-columns:minmax(0,1fr)}
.editor-bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.autosave{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sidepanel{position:sticky;top:64px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ptabs{display:grid;grid-template-columns:1fr 1fr auto;border-bottom:1px solid var(--line)}
.ptab{border:0;background:transparent;padding:12px;font-weight:500;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.ptab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.pbody{padding:16px;max-height:calc(100vh - 150px);overflow-y:auto;display:grid;gap:14px;align-content:start}
.quote{font-size:13.5px;color:var(--muted);background:#F1F1EF;border-radius:6px;padding:8px 10px;font-style:italic}
.thread{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.thread.resolved{opacity:.6}
.msg-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.msg-head strong{color:var(--ink);font-weight:600}
.msg{font-size:14.5px}
.reply{margin-left:14px;padding-left:12px;border-left:1px solid var(--line);display:grid;gap:4px}
.thread-actions{display:flex;gap:12px;flex-wrap:wrap}
.vrow{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.vrow-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vrow-head strong{font-family:var(--font-display);font-weight:500;font-size:17px}
.vrow .meta{font-size:13px;color:var(--muted)}
.vrow .resume{font-size:13.5px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1fr) 140px 140px auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:#F1F1EF;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row .name{font-weight:600}
.row .sub{font-size:13px;color:var(--muted)}
.row .acts{display:flex;gap:2px;justify-content:flex-end}
.srow{grid-template-columns:minmax(0,1.5fr) 150px minmax(0,1.2fr) auto}
.irow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto}
.tnum{font-variant-numeric:tabular-nums}
.search{max-width:320px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-family:var(--font-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:grid;gap:8px}
.bar{height:10px;background:#ECECEA;border-radius:999px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.avis{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.avis + .avis{margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;flex-wrap:wrap;justify-self:start}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:13.5px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.dol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.dol + .dol{margin-top:12px}
.dol .sol{font-size:14px;color:var(--muted)}
.dol .sol strong{color:var(--ink);font-weight:600}
.dol .who{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rank + .rank{margin-top:14px}
.rank-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;background:#F1F1EF}
.rank-head h3{font-size:18px}
.rank-item{display:grid;grid-template-columns:70px 1fr auto;gap:14px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.rank-item .cnt{font-family:var(--font-display);font-size:24px;line-height:1;color:var(--ok);font-variant-numeric:tabular-nums}
.rank-item .cnt span{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:4px}
.th-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.th-row:first-child{border-top:0}
.export-grid{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.settings{display:grid;gap:18px;max-width:840px}
.settings .panel{display:grid;gap:12px}
.team-row{display:grid;grid-template-columns:minmax(0,1fr) 170px 140px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.team-row:first-child{border-top:0}
.journal{display:grid;font-size:14px}
.journal div{display:grid;grid-template-columns:120px 150px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}

<script>
/* ===================== Outils ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad = n => String(n).padStart(2, '0');
const toD = d => (d instanceof Date ? d : new Date(d));
const fmt = d => { d = toD(d); return `${d.getDate()} ${M3[d.getMonth()]} à ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtLong = d => { d = toD(d); return `${d.getDate()} ${ML[d.getMonth()]}`; };

const excerpt = (t, n = 70) => t.length > n ? t.slice(0, n).trim() + '…' : t;
const initials = n => n.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
const val = id => (document.getElementById(id) || {}).value || '';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };

/* ===================== Le texte de la proposition 1 ===================== */
const TITRE = "Manifeste du secteur privé sénégalais\nde l'eau et de l'assainissement";
const SOUS_TITRE = "Conférence des Nations Unies sur l'eau · Abu Dhabi, décembre 2026";
const B = (id, type, html) => ({id, type, html});
const PROPOSITION = () => [
  B('p1','p',"Nous, entreprises privées sénégalaises de l'eau et de l'assainissement, concevons, construisons, exploitons et entretenons chaque jour les ouvrages qui apportent l'eau et l'assainissement aux populations. Des études au traitement et à la valorisation, nous sommes présents sur toute la chaîne de valeur."),
  B('p2','p',"Réunis à Dakar en octobre 2026, nous avons décidé de nous organiser et de parler d'une seule voix. À Abu Dhabi, dans une Conférence coorganisée par le Sénégal, nous prenons ensemble les engagements suivants."),
  B('h1','h','Notre constat'),
  B('p3','p',"Nous sommes <strong>présents comme opérateurs, mais absents comme investisseurs</strong>. Seuls 9 % des engagements de l'Agenda d'action pour l'eau viennent du secteur privé, et les entreprises africaines y sont presque invisibles. Pourtant, au moins 90 % des financements nécessaires peuvent venir de ressources nationales. Ces capitaux ont besoin d'entreprises africaines assez solides pour les mettre au travail. À quatre ans de l'échéance de l'ODD 6, le continent ne peut plus se passer de celles et ceux qui font l'eau au quotidien."),

  B('e1','li',"<strong>Nous organiser,</strong> à tous les niveaux : localement, nationalement, au sein de la CEDEAO, en Afrique et dans les enceintes internationales."),
  B('e2','li',"<strong>Respecter un standard commun d'entreprise sérieuse,</strong> pour que les États, les bailleurs, les banques et les populations sachent à qui faire confiance."),
  B('e3','li',"<strong>Investir dans les compétences</strong> de nos équipes, et dans la qualité, la sécurité et la durabilité de nos ouvrages."),
  B('e4','li',"<strong>Exploiter et entretenir ce que nous construisons,</strong> car un ouvrage qui ne fonctionne plus ne sert personne."),
  B('e5','li',"<strong>Travailler en transparence</strong> avec les pouvoirs publics, qui fixent les priorités. Nous construisons et exploitons ce qu'ils décident."),
  B('e6','li',"<strong>Agir ensemble pour les populations,</strong> par des actions collectives d'accès à l'eau et à l'assainissement."),
  B('h3','h','Nos demandes'),
  B('d1','li',"<strong>Une part de chaque grand programme d'eau et d'assainissement pour les entreprises locales,</strong> aux côtés des opérateurs internationaux. Le contenu local n'est pas une utopie, c'est un précédent."),
  B('d2','li',"<strong>Des appels d'offres conçus pour que les entreprises africaines sérieuses puissent y répondre en titulaires,</strong> et non plus seulement en sous-traitantes."),
  B('d3','li',"<strong>Un accès au financement adapté aux PME de l'eau,</strong> avec les banques, les institutions financières nationales et les partenaires au développement."),
  B('d4','li',"<strong>Une place dans les instances où se décident les priorités et les règles,</strong> au niveau national, régional et international."),
  B('h4','h','Notre conviction'),
  B('p4','p',"Les meilleurs investisseurs de l'eau sont ceux qui y travaillent chaque jour. Si les entreprises africaines restent absentes des lieux où se décident les priorités, l'Afrique risque de financer son développement hydraulique sans bâtir sa propre économie de l'eau. <strong>Organisés, plus forts et bien accompagnés, nous pouvons porter ces 9 % beaucoup plus loin.</strong>"),

  B('m1','mention',"Signé à Abu Dhabi, le 10 décembre 2026, et à distance depuis le Sénégal. Liste des signataires en annexe.")

const THEMES = ['Accès aux marchés publics', 'Délais de paiement', 'Financement et garanties', 'Normes et réglementation', 'Formation et compétences', 'Contenu local'];
const ADMINS = () => [{id:'u1', nom:'Aziz Fall', email:'aziz@exemple.sn', statut:'actif', acces:true}];
const CEOS = () => [
  ['Aminata','Diallo','Directrice générale','Niayes Hydro',0,'+221 77 000 01 01'],

].map((r, i) => ({id:'c' + (i + 1), prenom:r[0], nom:r[1], fonction:r[2], entreprise:r[3], maillon:MAILLONS[r[4]], tel:r[5], jeton:token(), statut:'a_envoyer', envoyeLe:null, ouvertLe:null, relances:0, derniereRelance:null, photo:false, consAnnuaire:false, consCom:false, consSuite:false}));

/* ===================== Comparaison de deux versions ===================== */
/* Les blocs importés sont alignés sur la version précédente : un bloc inchangé ou modifié garde son identifiant (utile pour les commentaires des CEO). */
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const bkey = b => b.type + '|' + plain(b.html);
function lcsOps(A, Bk){
  const n = A.length, m = Bk.length; const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === Bk[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m){ if (A[i] === Bk[j]){ ops.push(['eq', i, j]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['del', i++, null]); else ops.push(['ins', null, j++]); }
  while (i < n) ops.push(['del', i++, null]); while (j < m) ops.push(['ins', null, j++]);
  return ops;
}
function sectionAt(blocks, idx){ for (let i = idx; i >= 0; i--) if (blocks[i] && blocks[i].type === 'h') return plain(blocks[i].html); return 'Introduction'; }
function align(prev, next){
  const ops = lcsOps(prev.map(bkey), next.map(bkey));
  const out = next.map(b => ({...b})); const by = {}, order = [];
  const add = (sec, k) => { if (!by[sec]){ by[sec] = {mod:0, add:0, del:0}; order.push(sec); } by[sec][k]++; };
  for (let k = 0; k < ops.length; k++){
    const [t, i, j] = ops[k];
    if (t === 'eq'){ out[j].id = prev[i].id; continue; }
    if (t === 'del' && ops[k + 1] && ops[k + 1][0] === 'ins' && prev[i].type === next[ops[k + 1][2]].type){ const jj = ops[k + 1][2]; out[jj].id = prev[i].id; add(sectionAt(next, jj), 'mod'); k++; continue; }
    if (t === 'ins' && ops[k + 1] && ops[k + 1][0] === 'del' && next[j].type === prev[ops[k + 1][1]].type){ out[j].id = prev[ops[k + 1][1]].id; add(sectionAt(next, j), 'mod'); k++; continue; }
    if (t === 'del') add(sectionAt(prev, i), 'del'); else { out[j].id = uid('b'); add(sectionAt(next, j), 'add'); }
  }
  const w = (n, s, p) => `${n} ${n > 1 ? p : s}`;
  const parts = order.map(s => { const c = by[s]; const t = []; if (c.mod) t.push(w(c.mod, 'modification', 'modifications')); if (c.add) t.push(w(c.add, 'ajout', 'ajouts')); if (c.del) t.push(w(c.del, 'suppression', 'suppressions')); return `${cap(s.toLowerCase())} : ${t.join(', ')}`; });
  return {blocks:out, resume:parts.length ? parts.join(' · ') : 'Aucune modification du texte', changed:parts.length > 0};
}
function diffHtml(a, b){
  const tok = bl => bl.flatMap((x, i) => [...(i ? ['¶'] : []), ...plain(x.html).split(/\s+/).filter(Boolean)]);
  const A = tok(a), Bt = tok(b);
  return lcsOps(A, Bt).map(([t, i, j]) => { const w = t === 'ins' ? Bt[j] : A[i]; if (w === '¶') return t === 'del' ? '' : '<br><br>'; return t === 'eq' ? esc(w) + ' ' : t === 'ins' ? `<ins>${esc(w)}</ins> ` : `<del>${esc(w)}</del> `; }).join('');
}

/* Lit les styles Google Docs / Word : Titre, Sous-titre, Titre 1, Titre 2, Titre 3, listes numérotées, texte normal. */
async function parseDocx(file){
  const zip = await JSZip.loadAsync(file);
  const docXml = await zip.file('word/document.xml').async('string');
  const stylesXml = zip.file('word/styles.xml') ? await zip.file('word/styles.xml').async('string') : '';
  const P = new DOMParser(); const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const doc = P.parseFromString(docXml, 'application/xml'); const sty = stylesXml ? P.parseFromString(stylesXml, 'application/xml') : null;
  const names = {};
  if (sty) [...sty.getElementsByTagNameNS(W, 'style')].forEach(s => { const id = s.getAttributeNS(W, 'styleId') || s.getAttribute('w:styleId'); const n = s.getElementsByTagNameNS(W, 'name')[0]; names[id] = n ? (n.getAttributeNS(W, 'val') || n.getAttribute('w:val')) : id; });
  const norm = s => (s || '').toLowerCase().replace(/[\s_-]/g, '');
  const kind = id => { const a = norm(id), b = norm(names[id]); const k = [a, b];
    if (k.some(x => x === 'title' || x === 'titre')) return 'titre';
    if (k.some(x => x === 'subtitle' || x === 'soustitre')) return 'sous';
    if (k.some(x => x === 'heading1' || x === 'titre1')) return 'h';
    if (k.some(x => x === 'heading2' || x === 'titre2')) return 'accroche';
    if (k.some(x => x === 'heading3' || x === 'titre3')) return 'mention';
    if (k.some(x => /^(heading|titre)[4-9]$/.test(x))) return 'autreTitre';
    return 'normal'; };
  const attr = (el, n) => el.getAttributeNS(W, n) || el.getAttribute('w:' + n);
  const on = el => { if (!el) return false; const v = attr(el, 'val'); return !(v === '0' || v === 'false' || v === 'none'); };
  const body = doc.getElementsByTagNameNS(W, 'body')[0];
  const warnings = []; let suggestions = 0, images = 0, tables = 0, titre = [], sous = '', blocks = [], ignoredKicker = false, autreTitres = 0;
  const runHtml = (r, inTitle) => {
    const rPr = r.getElementsByTagNameNS(W, 'rPr')[0];
    const b = rPr && on(rPr.getElementsByTagNameNS(W, 'b')[0]); const i = rPr && on(rPr.getElementsByTagNameNS(W, 'i')[0]);
    let t = '';
    [...r.childNodes].forEach(n => { if (n.localName === 't') t += n.textContent; else if (n.localName === 'tab') t += ' '; else if (n.localName === 'br') t += inTitle ? '\n' : ' '; else if (n.localName === 'drawing' || n.localName === 'pict') images++; });
    if (!t) return '';
    let h = esc(t); if (i) h = `<em>${h}</em>`; if (b) h = `<strong>${h}</strong>`; return h;
  };
  const paraHtml = (p, inTitle) => {
    let out = '';
    [...p.childNodes].forEach(n => {
      if (n.localName === 'r') out += runHtml(n, inTitle);
      else if (n.localName === 'ins'){ suggestions++; [...n.getElementsByTagNameNS(W, 'r')].forEach(r => out += runHtml(r, inTitle)); }
      else if (n.localName === 'del') suggestions++;
      else if (n.localName === 'hyperlink' || n.localName === 'smartTag' || n.localName === 'sdt') [...n.getElementsByTagNameNS(W, 'r')].forEach(r => out += runHtml(r, inTitle));
    });
    return out.replace(/<\/strong><strong>/g, '').replace(/<\/em><em>/g, '');
  };
  [...body.childNodes].forEach(el => {
    if (el.localName === 'tbl'){ tables++; return; }
    if (el.localName !== 'p') return;
    const pPr = el.getElementsByTagNameNS(W, 'pPr')[0];
    const sEl = pPr && pPr.getElementsByTagNameNS(W, 'pStyle')[0];
    const k = kind(sEl ? attr(sEl, 'val') : 'Normal');
    const numbered = !!(pPr && pPr.getElementsByTagNameNS(W, 'numPr')[0]);
    if (k === 'titre'){ const h = paraHtml(el, true); if (plain(h)) titre.push(plain(h.replace(/\n/g, '¶')).replace(/¶/g, '\n')); return; }
    const html = paraHtml(el, false).replace(/\s{2,}/g, ' ').trim(); const txt = plain(html);
    if (!txt) return;
    if (/^proposition de texte/i.test(txt)){ ignoredKicker = true; return; }
    if (k === 'sous'){ sous = sous ? sous + ' ' + txt : txt; return; }
    if (k === 'autreTitre'){ autreTitres++; blocks.push({id:uid('b'), type:'h', html:esc(txt)}); return; }
    if (k === 'h' || k === 'accroche' || k === 'mention'){ blocks.push({id:uid('b'), type:k, html:esc(txt)}); return; }
    if (numbered){ blocks.push({id:uid('b'), type:'li', html}); return; }

  });
  if (suggestions) warnings.unshift({level:'bloquant', msg:`${suggestions} suggestion${suggestions > 1 ? 's' : ''} Google Docs non acceptée${suggestions > 1 ? 's' : ''} ou refusée${suggestions > 1 ? 's' : ''}. Acceptez-les ou refusez-les dans le Google Doc, puis téléchargez à nouveau le fichier.`});
  if (!titre.length) warnings.unshift({level:'bloquant', msg:'Aucun paragraphe au style « Titre » : le titre du Manifeste est introuvable.'});

  if (images) warnings.push({level:'info', msg:`${images} image${images > 1 ? 's' : ''} ignorée${images > 1 ? 's' : ''} : le Manifeste n'en contient pas.`});

/* ===================== Mise en page A4 ===================== */
let measureHost = null;
function ensureMeasure(){
  if (measureHost) return measureHost;
  measureHost = document.createElement('div'); measureHost.className = 'a4-wrap'; measureHost.setAttribute('aria-hidden', 'true');
  measureHost.style.cssText = 'position:absolute;left:-10000px;top:0;width:800px;max-width:none;visibility:hidden;pointer-events:none';
  document.body.appendChild(measureHost); return measureHost;
}
function numsOf(blocks){ let n = 0; return blocks.map(b => { if (b.type === 'h') n = 0; return b.type === 'li' ? ++n : null; }); }
function headHtml(v, draft){
  return `${draft ? '<div class="d-kicker">Proposition de texte · À valider par les CEO</div>' : ''}<h2 class="d-title">${esc(v.titre).replace(/\n/g, '<br>')}</h2><div class="d-sub">${esc(v.sousTitre)}</div><div class="d-rule"></div>`;
}
function a4Block(b, num){ return `<div class="a4-blk ${b.type}">${b.type === 'li' ? `<span class="num">${num}.</span>` : ''}<p class="txt">${b.html}</p></div>`; }
const isDraft = () => S.m.statut === 'redaction';
function footLeft(){ return `Manifeste du secteur privé sénégalais de l'eau et de l'assainissement${isDraft() ? ' · Proposition' : ''}`; }
function paginate(v){
  const host = ensureMeasure(); const nums = numsOf(v.blocks);
  host.innerHTML = `<div class="a4-page" style="height:${(800 * 297 / 210).toFixed(2)}px;aspect-ratio:auto;overflow:hidden"><div class="a4-body" style="overflow:hidden"><div class="a4-flow"><div class="mhead">${headHtml(v, isDraft())}</div><div class="mcol">${v.blocks.map((b, i) => a4Block(b, nums[i])).join('')}<div class="mend"></div></div></div></div><div class="a4-foot"><span>${footLeft()}</span><span>1 / 1</span></div></div>`;
  const body = host.querySelector('.a4-body'); const capH = body.clientHeight; const top = body.getBoundingClientRect().top;
  const col = host.querySelector('.mcol'); const headH = col.getBoundingClientRect().top - top;
  const tops = [...col.children].map(e => e.getBoundingClientRect().top); const h = v.blocks.map((b, i) => tops[i + 1] - tops[i]);
  const pages = [[]]; let used = headH;
  v.blocks.forEach((b, i) => { if (used + h[i] > capH + 0.5 && pages[pages.length - 1].length){ pages.push([]); used = 0; } pages[pages.length - 1].push(i); used += h[i]; });
  for (let p = 0; p < pages.length - 1; p++){ const pg = pages[p]; while (pg.length > 1 && v.blocks[pg[pg.length - 1]].type === 'h') pages[p + 1].unshift(pg.pop()); }
  return pages;
}
function textPages(v, total){
  const pages = paginate(v); const nums = numsOf(v.blocks); const tot = total || pages.length;
  return {pages, html:pages.map((idxs, p) => `<div class="a4-wrap"><div class="a4-page"><div class="a4-body"><div class="a4-flow">${p === 0 ? headHtml(v, isDraft()) : ''}${idxs.map(i => a4Block(v.blocks[i], nums[i])).join('')}</div></div><div class="a4-foot"><span>${footLeft()}</span><span>${p + 1} / ${tot}</span></div></div></div>`)};
}
function sortedSigs(){
  const s = [...S.signatures];
  if (S.exportOrder === 'entreprise') s.sort((a, b) => a.entreprise.localeCompare(b.entreprise, 'fr'));
  else if (S.exportOrder === 'nom') s.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  else if (S.exportOrder === 'maillon') s.sort((a, b) => S.m.maillons.indexOf(a.maillon) - S.m.maillons.indexOf(b.maillon) || a.entreprise.localeCompare(b.entreprise, 'fr'));
  else s.sort((a, b) => a.le - b.le);
  return s;
}
function annexPages(start, total){
  const sigs = sortedSigs(); const R = S.rowsPerPage;
  const entries = [...sigs.map(s => ({s})), ...Array.from({length:S.blankRows}, () => ({blank:true}))];
  const nP = Math.max(1, Math.ceil(entries.length / R)); const out = [];
  for (let p = 0; p < nP; p++){
    const slice = entries.slice(p * R, p * R + R);
    let cells = ['N°','Entreprise','Maillon','Nom et fonction du signataire','Signature'].map(t => `<div class="th">${t}</div>`).join('');
    slice.forEach((e, k) => { const n = p * R + k + 1; cells += e.blank ? `<div class="no">${n}</div><div></div><div></div><div></div><div></div>` : `<div class="no">${n}</div><div>${esc(e.s.entreprise)}</div><div>${esc(e.s.maillon)}</div><div class="nf"><strong>${esc(e.s.prenom)} ${esc(e.s.nom)}</strong><span>${esc(e.s.fonction)}</span></div><div class="sg">${sigSvg(e.s.img, 'xMidYMid meet')}</div>`; });
    for (let k = slice.length; k < R; k++) cells += '<div class="ghost"></div>'.repeat(5);
    out.push(`<div class="a4-wrap"><div class="a4-page"><div class="a4-body"><div class="ann-title">Annexe · Les signataires${p ? ' (suite)' : ''}</div><div class="ann-table" style="grid-template-rows:auto repeat(${R}, 1fr)">${cells}</div></div><div class="a4-foot"><span>${footLeft()}</span><span>${start + p} / ${total}</span></div></div></div>`);
  }
  return {html:out, n:sigs.length};
}
function documentPages(){
  const v = lastV(); const nText = paginate(v).length; const nAnnex = Math.max(1, Math.ceil((S.signatures.length + S.blankRows) / S.rowsPerPage)); const total = nText + nAnnex;
  const T = textPages(v, total); const A2 = annexPages(nText + 1, total);
  return {html:[...T.html, ...A2.html].join(''), nText, nAnnex, total, n:A2.n};
}

const FIELDS = [['prenom','Prénom'],['nom','Nom'],['fonction','Fonction'],['entreprise','Entreprise'],['maillon','Maillon'],['tel','Téléphone']];

      <div class="field"><label for="rpp">Signataires par page d'annexe</label><select class="select" id="rpp" data-change="rpp">${[8,10,15].map(n => `<option value="${n}" ${S.rowsPerPage === n ? 'selected' : ''}>${n} lignes${n === 8 ? ' (signatures plus grandes)' : n === 15 ? ' (comme le document Word)' : ''}</option>`).join('')}</select></div>
      <div class="field"><label for="blank">Lignes vides pour signer sur place à Abu Dhabi</label><select class="select" id="blank" data-change="blank">${[0,5,10].map(n => `<option value="${n}" ${S.blankRows === n ? 'selected' : ''}>${n ? n + ' lignes vides' : 'Aucune'}</option>`).join('')}</select></div>
      <dl class="kv"><dt>Format</dt><dd>A4 portrait</dd><dt>Texte</dt><dd class="tnum">${Dc.nText === 1 ? 'page 1' : 'pages 1 à ' + Dc.nText}</dd><dt>Annexe</dt><dd class="tnum">${Dc.nAnnex === 1 ? 'page ' + (Dc.nText + 1) : 'pages ' + (Dc.nText + 1) + ' à ' + Dc.total}</dd><dt>Signataires</dt><dd class="tnum">${Dc.n}</dd><dt>Version</dt><dd>${v.num}${v.type === 'correction_mineure' ? ' (correction mineure)' : ''}</dd></dl>
      <div class="notice ok" style="margin:0">${ic('pen-tool')}<div class="grow small">Signatures en tracé vectoriel : nettes à l'impression, quelle que soit la taille.</div></div>
      <button class="btn" data-a="bigSig" ${Dc.n ? '' : 'disabled'} style="justify-content:center">${ic('zoom-in')}Voir une signature en grand</button>
      <button class="btn btn-primary" data-a="genPdf" style="justify-content:center">${ic('file-down')}Générer le PDF A4</button>
      <p class="small muted">La version anglaise du texte sera ajoutée après le gel, hors plateforme.</p></div>
    <div class="a4-stack">${Dc.html}</div></div>`;
}

/* ----- Réglages ----- */
function pReglages(){
  const tabs = [['manifeste','Manifeste','file-text'],['equipe','Admins','shield-check'],['messages','Messages','message-circle'],['journal','Journal','history']];
  const dl = new Date(S.m.dateLimite); const dval = `${dl.getFullYear()}-${pad(dl.getMonth() + 1)}-${pad(dl.getDate())}`;
  let body = '';
  if (S.regTab === 'manifeste') body = `<div class="panel"><h3>Signature</h3>
      <div class="field" style="max-width:240px"><label for="s-date">Date limite des signatures</label><input class="input" type="date" id="s-date" value="${dval}"></div>
      <div class="field"><label for="s-gdoc">Lien du Google Doc de rédaction</label><input class="input" id="s-gdoc" value="${esc(S.m.gdoc)}"></div>
      <label class="check"><input type="checkbox" id="s-auto" ${S.m.autoValid ? 'checked' : ''}><span>Valider automatiquement les signatures dont les informations sont identiques à la liste importée. Les autres passent dans « À vérifier ».</span></label>
      <div><button class="btn btn-primary btn-sm" data-a="saveManifeste">${ic('save')}Enregistrer</button></div>
      <p class="small muted">Le titre et le sous-titre viennent du document importé (styles Titre et Sous-titre).</p></div>
    <div class="panel"><h3>Texte de consentement</h3><p class="small muted">Affiché au CEO juste avant la signature. La case doit être cochée pour signer. Le texte accepté est conservé avec chaque signature.</p><textarea class="textarea" id="s-consent">${esc(S.m.consentement)}</textarea><div><button class="btn btn-sm" data-a="saveConsent">${ic('save')}Enregistrer</button></div></div>
    <div class="panel"><h3>Maillons de la chaîne de valeur</h3><p class="small muted">Utilisés dans la liste des CEO et dans la colonne « Maillon » de l'annexe. Un maillon par ligne.</p><textarea class="textarea" id="s-maillons" style="min-height:110px">${esc(S.m.maillons.join('\n'))}</textarea><div><button class="btn btn-sm" data-a="saveMaillons">${ic('save')}Enregistrer</button></div></div>`;
  else if (S.regTab === 'equipe') body = `<div class="panel"><h3>Admins</h3><p class="small muted">Les admins se connectent avec leur email et leur mot de passe. Tous ont les mêmes droits : importer, geler, clore, publier, gérer les CEO et les doléances. Il reste toujours au moins un admin actif. Les rédacteurs, eux, travaillent dans le Google Doc et n'ont pas d'accès ici.</p>
      <div>${S.admins.map(u => { const self = u.id === S.user; const chip = !u.acces ? '<span class="chip chip-danger">Accès coupé</span>' : u.statut === 'actif' ? '<span class="chip chip-ok">Actif</span>' : '<span class="chip chip-clay">Invitation envoyée</span>';
        const acts = self ? '' : u.acces ? `${u.statut === 'invite' ? `<button class="icon-btn sm" data-a="resendInvite" data-id="${u.id}" title="Renvoyer l'invitation" aria-label="Renvoyer l'invitation">${ic('mail')}</button>` : ''}<button class="icon-btn sm" data-a="askCutUser" data-id="${u.id}" title="Couper l'accès" aria-label="Couper l'accès">${ic('user-x')}</button>` : `<button class="btn btn-sm" data-a="restoreAdmin" data-id="${u.id}">${ic('rotate-ccw')}Rétablir</button>`;
        return `<div class="team-row" style="grid-template-columns:minmax(0,1fr) 150px auto"><div><div style="font-weight:600">${esc(u.nom)}${self ? ' <span class="chip chip-grey">vous</span>' : ''}</div><div class="small muted">${esc(u.email)}</div></div>${chip}<div style="display:flex;gap:2px;justify-content:flex-end">${acts}</div></div>`; }).join('')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end"><div class="field"><label for="i-nom">Nom</label><input class="input" id="i-nom" placeholder="Prénom Nom"></div><div class="field"><label for="i-email">Email</label><input class="input" id="i-email" type="email" placeholder="adresse@exemple.sn"></div><button class="btn btn-primary" data-a="invite">${ic('user-plus')}Inviter</button></div>
      <p class="small muted">La personne reçoit une invitation par email pour choisir son mot de passe.</p>${S.inviteErr ? `<div class="err">${esc(S.inviteErr)}</div>` : ''}</div>`;
  else if (S.regTab === 'messages') body = `<div class="panel"><h3>Message WhatsApp aux CEO</h3><p class="small muted">Variables disponibles : {prenom}, {lien}, {date_limite}.</p><textarea class="textarea" id="s-modele" style="min-height:200px">${esc(S.m.modele)}</textarea><div><button class="btn btn-sm" data-a="saveModele">${ic('save')}Enregistrer</button></div></div>`;
  else body = `<div class="panel"><h3>Journal</h3><div class="journal">${S.journal.slice(0, 40).map(j => `<div><span class="muted tnum">${fmt(j.le)}</span><strong>${esc(j.acteur)}</strong><span>${esc(j.action)}</span></div>`).join('')}</div></div>`;
  return `<div class="page-head"><div><h2>Réglages</h2></div></div>
    <div class="tabs2" role="tablist">${tabs.map(t => `<button class="tab2" role="tab" aria-selected="${S.regTab === t[0]}" data-a="regTab" data-t="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('')}</div>
    <div class="settings">${body}</div>`;
}

/* ===================== Modales ===================== */
function fillMsg(c, relance){ const t = S.m.modele.replace(/\{prenom\}/g, c.prenom).replace(/\{lien\}/g, linkOf(c)).replace(/\{date_limite\}/g, fmtLong(S.m.dateLimite)); return relance ? `Petit rappel. ${t}` : t; }
const waHref = (tel, msg) => 'https://wa.me/' + tel.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
function maillonOptions(sel){ return S.m.maillons.map(m => `<option ${m === sel ? 'selected' : ''}>${esc(m)}</option>`).join(''); }
function modalHtml(){
  const m = S.modal;
  const wrap = (title, body, foot, wide) => `<div class="modal-back" data-a="closeBack"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-a="closeModal" aria-label="Fermer">${ic('x')}</button></div><div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;
  const cancel = `<button class="btn btn-ghost" data-a="closeModal">Annuler</button>`;
  switch (m.type){
    case 'freeze': { const v = lastV(); const np = paginate(v).length;
      return wrap(`Geler la version ${v.num}`, `<p>La version ${v.num} (${esc(v.src)}) devient la <strong>version de signature</strong>. Le texte tient sur ${np} page${np > 1 ? 's' : ''} A4.</p>
        <ul class="list"><li>${ic('check')}La mention « Proposition de texte » disparaît du document.</li><li>${ic('check')}Les liens des CEO deviennent actifs et peuvent être envoyés.</li><li>${ic('check')}Passez le Google Doc en lecture seule : désormais, la plateforme fait foi.</li><li>${ic('check')}Ensuite, seules les corrections mineures sont possibles, par import, avec contrôle des différences.</li></ul>
        <label class="check"><input type="checkbox" id="fz-ok"><span>Je confirme que ce texte a été validé.</span></label>${m.err ? `<div class="err">${esc(m.err)}</div>` : ''}`,
        cancel + `<button class="btn btn-primary" data-a="confirmFreeze">${ic('lock')}Geler la version ${v.num}</button>`); }
    case 'diff': { const a = lastV(); const b = S.review;
      return wrap(`Détail : version ${a.num} et fichier importé`, `<div class="small muted">${esc(b.resume)}</div><div class="diff">${diffHtml(a.blocks, b.blocks)}</div>`, `<button class="btn" data-a="closeModal">Fermer</button>`, true); }
    case 'compare': { const a = S.versions.find(x => x.num === m.a), b = S.versions.find(x => x.num === m.b);
      return wrap('Comparer deux versions', `<div class="actions"><label class="small muted" for="cmp-a">De la version <select class="select" style="width:auto;display:inline-block" id="cmp-a" data-change="cmpA">${S.versions.map(v => `<option value="${v.num}" ${v.num === m.a ? 'selected' : ''}>${v.num}</option>`).join('')}</select></label><label class="small muted" for="cmp-b">à la version <select class="select" style="width:auto;display:inline-block" id="cmp-b" data-change="cmpB">${S.versions.map(v => `<option value="${v.num}" ${v.num === m.b ? 'selected' : ''}>${v.num}</option>`).join('')}</select></label></div><div class="small muted">${esc(align(a.blocks, b.blocks).resume)}</div><div class="diff">${diffHtml(a.blocks, b.blocks)}</div>`, `<button class="btn" data-a="closeModal">Fermer</button>`, true); }
    case 'restore': return wrap(`Restaurer la version ${m.n}`, `<p>Le contenu de la version ${m.n} sera repris dans une nouvelle version ${lastV().num + 1}. Rien n'est effacé. Pensez à remettre le Google Doc au même texte pour éviter un écart au prochain import.</p>`, cancel + `<button class="btn btn-primary" data-a="confirmRestore">${ic('rotate-ccw')}Restaurer</button>`);
    case 'ceo': { const c = m.id ? ceoById(m.id) : {prenom:'', nom:'', fonction:'', entreprise:'', maillon:S.m.maillons[0], tel:'+221 '};
      return wrap(m.id ? 'Modifier un CEO' : 'Ajouter un CEO', `<div class="grid2">
        <div class="field"><label for="c-prenom">Prénom</label><input class="input" id="c-prenom" value="${esc(c.prenom)}"></div><div class="field"><label for="c-nom">Nom</label><input class="input" id="c-nom" value="${esc(c.nom)}"></div>
        <div class="field"><label for="c-fonction">Fonction</label><input class="input" id="c-fonction" value="${esc(c.fonction)}" placeholder="Directeur général"></div><div class="field"><label for="c-entreprise">Entreprise</label><input class="input" id="c-entreprise" value="${esc(c.entreprise)}"></div>
        <div class="field"><label for="c-maillon">Maillon</label><select class="select" id="c-maillon">${maillonOptions(c.maillon)}</select></div><div class="field"><label for="c-tel">Téléphone WhatsApp</label><input class="input" id="c-tel" value="${esc(c.tel)}" inputmode="tel"></div></div>
        ${m.err ? `<div class="err">${esc(m.err)}</div>` : ''}${m.id && c.statut === 'signe' ? `<p class="small muted">Ce CEO a déjà signé : sa signature garde les informations confirmées au moment de signer.</p>` : ''}`, cancel + `<button class="btn btn-primary" data-a="saveCeo">${ic('save')}${m.id ? 'Enregistrer' : 'Ajouter'}</button>`); }
    case 'lien': {
      const url = BASE_URL.replace('/s/', '/rejoindre');
      return wrap('Lien ouvert', `<p>Pour les CEO qui ne sont pas dans votre liste. Partagez-le dans les groupes WhatsApp, ou affichez le QR code. Chaque inscription arrive dans « À vérifier » et n'entre dans l'annexe qu'après votre validation.</p>
        <div style="display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center"><div id="qr" style="width:150px;height:150px;background:#fff;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:8px" aria-label="QR code du lien ouvert"></div>
        <div style="display:grid;gap:8px"><div class="small muted">Adresse</div><div class="tnum" style="word-break:break-all;font-weight:500">${esc(url)}</div><div class="small muted">${S.m.viaLien} inscription${S.m.viaLien > 1 ? 's' : ''} par ce lien. Il se ferme à la clôture des signatures.</div></div></div>
        <label class="check"><input type="checkbox" id="lien-on" data-change="lienOn" ${S.m.lienOuvert ? 'checked' : ''}><span>Lien actif. Décochez pour le mettre en pause, en cas d'abus par exemple.</span></label>`,
        `<button class="btn btn-ghost" data-a="copyLien">${ic('copy')}Copier</button><a class="btn btn-wa" href="https://wa.me/?text=${encodeURIComponent("Dirigeants d'entreprises sénégalaises de l'eau et de l'assainissement : lisez et signez le Manifeste qui sera présenté à Abu Dhabi. " + url)}" target="_blank" rel="noopener">${ic('message-circle')}Partager sur WhatsApp</a>`);
    }
    case 'delCeo': { const c = ceoById(m.id); return wrap('Retirer de la liste', `<p>Retirer <strong>${esc(c.prenom)} ${esc(c.nom)}</strong> (${esc(c.entreprise)}) ? Son lien personnel ne fonctionnera plus.</p>`, cancel + `<button class="btn btn-danger" data-a="confirmDelCeo">${ic('trash-2')}Retirer</button>`); }
    case 'import': { const rows = m.rows || []; const ok = rows.filter(r => !r.err).length;
      return wrap('Importer la liste des CEO', `<div class="drop" style="padding:16px">${ic('file-spreadsheet')}<strong>Fichier Excel ou CSV</strong><span class="small muted">Par exemple la liste du déjeuner du 22 octobre ou la cartographie par maillon. Les colonnes sont reconnues par leur titre.</span><span class="btn btn-primary btn-sm file-btn">${ic('upload')}Choisir le fichier<input type="file" accept=".xlsx,.xls,.csv" id="xls-in" aria-label="Choisir le fichier Excel"></span></div>
        ${m.fileName ? `<div class="small"><strong>${esc(m.fileName)}</strong> : ${rows.length} ligne${rows.length > 1 ? 's' : ''} lue${rows.length > 1 ? 's' : ''}, ${ok} importable${ok > 1 ? 's' : ''}.</div>` : ''}
        <details><summary class="small muted" style="cursor:pointer">Ou coller des lignes</summary><p class="small muted">Une ligne par CEO, champs séparés par des points-virgules : prénom ; nom ; fonction ; entreprise ; maillon ; téléphone.</p>
        <textarea class="textarea" id="imp" style="min-height:110px" placeholder="Mamadou;Kane;Directeur général;Exemple Forages;Production;+221 77 000 02 01">${esc(m.raw || '')}</textarea><div><button class="btn btn-sm" data-a="parseImport">${ic('scan-line')}Analyser</button></div></details>
        ${rows.length ? `<div class="rows">${rows.map(r => `<div class="row irow"><div><div class="name">${esc(r.prenom)} ${esc(r.nom)}</div><div class="sub">${esc(r.entreprise)}</div></div><div class="sub">${esc(r.maillon)}</div><div class="tnum sub c-full">${esc(r.tel)}</div><div>${r.err ? `<span class="chip chip-danger">${esc(r.err)}</span>` : r.warn ? `<span class="chip chip-clay">${esc(r.warn)}</span>` : '<span class="chip chip-ok">Valide</span>'}</div></div>`).join('')}</div>` : ''}`,
        cancel + `<button class="btn btn-primary" data-a="doImport" ${ok ? '' : 'disabled'}>${ic('upload')}Importer ${ok || ''} CEO</button>`, true); }
    case 'wa': { const c = ceoById(m.id);
      return wrap(m.r ? `Relancer ${c.prenom} ${c.nom}` : `Envoyer à ${c.prenom} ${c.nom}`, `<dl class="kv"><dt>Destinataire</dt><dd>${esc(c.prenom)} ${esc(c.nom)}, ${esc(c.entreprise)}</dd><dt>WhatsApp</dt><dd class="tnum">${esc(c.tel)}</dd></dl>
        <div class="field"><label for="wa-msg">Message (modifiable)</label><textarea class="textarea" id="wa-msg" style="min-height:210px" data-input="waMsg">${esc(m.msg)}</textarea></div><p class="small muted">Le bouton ouvre WhatsApp avec ce message prêt : il ne reste qu'à appuyer sur Envoyer. Dans le prototype, le numéro est fictif.</p>`,
        `<button class="btn btn-ghost" data-a="copyWa">${ic('copy')}Copier le message</button><a class="btn btn-wa" id="wa-link" href="${waHref(c.tel, m.msg)}" target="_blank" rel="noopener" data-a="waOpened" data-id="${c.id}">${ic('message-circle')}Ouvrir WhatsApp</a>`); }
    case 'queue': { if (m.i >= m.ids.length) return wrap('Relances', `<p>Toutes les relances de la file sont faites.</p>`, `<button class="btn btn-primary" data-a="closeModal">Terminer</button>`);
      const c = ceoById(m.ids[m.i]); const msg = fillMsg(c, true);
      return wrap(`Relance ${m.i + 1} sur ${m.ids.length}`, `<p class="small muted">Les CEO qui ont reçu le lien sans signer, un par un. WhatsApp impose un clic par message.</p><div class="person">${avatar(c)}<div><strong>${esc(c.prenom)} ${esc(c.nom)}</strong>, ${esc(c.entreprise)}<div>${statChip(c.statut)}</div></div></div><div class="wa-box">${esc(msg)}</div>`,
        `<button class="btn btn-ghost" data-a="queueSkip">Passer</button><a class="btn btn-wa" href="${waHref(c.tel, msg)}" target="_blank" rel="noopener" data-a="queueSend" data-id="${c.id}">${ic('message-circle')}Relancer sur WhatsApp</a>`); }
    case 'sig': { const s = sigOf(m.id); const c = ceoById(m.id);
      return wrap(`Signature de ${s.prenom} ${s.nom}`, `<div class="sig-preview">${sigSvg(s.img)}<div class="nm">${esc(s.prenom)} ${esc(s.nom)}</div><div class="muted">${esc(s.fonction)}</div><div style="font-weight:600">${esc(s.entreprise)}</div><div class="small muted">${esc(s.maillon)}</div></div>
        <dl class="kv"><dt>Signé le</dt><dd>${fmt(s.le)}</dd><dt>Version signée</dt><dd>${s.versionNum}</dd><dt>Consentement</dt><dd>${esc(s.consentement)}</dd><dt>Photo</dt><dd>${c.photo ? 'Ajoutée' : 'Non ajoutée'}</dd><dt>Annuaire</dt><dd>${c.consAnnuaire ? 'Accepté' : 'Non'}</dd><dt>Communication</dt><dd>${c.consCom ? 'Photo utilisable' : 'Non'}</dd><dt>Recontact</dt><dd>${c.consSuite ? 'Accepté' : 'Non'}</dd></dl>`, `<button class="btn" data-a="closeModal">Fermer</button>`); }
    case 'bigSig': { const s = sortedSigs()[0]; return wrap('Signature en grand', `<div class="big-sig">${sigSvg(s.img)}</div><p class="small muted">Signature de ${esc(s.prenom)} ${esc(s.nom)}, agrandie. Le tracé est vectoriel : il reste net à toute taille.</p>`, `<button class="btn" data-a="closeModal">Fermer</button>`, true); }
    case 'integre': { const a = S.ceoComments.find(x => x.id === m.id);
      return wrap('Intégrer au texte signé ?', `<div class="notice clay" style="margin:0">${ic('alert-triangle')}<div class="grow">Le texte est gelé et <strong>${S.signatures.length} CEO ont déjà signé</strong>. Si ce commentaire change le fond, il faudra les recontacter un par un.</div></div><p>Recommandation : « Retenu pour la suite ». « Intégré au texte » seulement pour une correction de forme.</p><div class="quote">${esc(a.texte)}</div>`,
        `<button class="btn btn-ghost" data-a="traitLater" data-id="${a.id}">Retenu pour la suite</button><button class="btn btn-primary" data-a="traitIntegre" data-id="${a.id}">Intégrer quand même</button>`); }
    case 'close': return wrap('Clore les signatures', `<p>Plus aucun CEO ne pourra signer. Les liens afficheront « Les signatures sont closes ». Vous pourrez rouvrir si besoin.</p><p class="muted">${counts().signe} signatures sur ${S.ceos.length}.</p>`, cancel + `<button class="btn btn-primary" data-a="confirmClose">${ic('circle-slash')}Clore</button>`);
    case 'publish': return wrap('Publier le document final', `<p>Chaque CEO verra, depuis son lien, le document final A4 complet avec l'annexe des signataires, et pourra le télécharger.</p><label class="check"><input type="checkbox" id="pub-dol" checked><span>Ouvrir en même temps le cahier de doléances, jusqu'au ${fmtLong(S.m.dolCloture)} ${new Date(S.m.dolCloture).getFullYear()}.</span></label><p class="muted">Après Abu Dhabi, ou le jour de la remise.</p>`, cancel + `<button class="btn btn-primary" data-a="confirmPublish">${ic('badge-check')}Publier</button>`);
    case 'merge': { const t = S.themes.find(x => x.id === m.id); return wrap(`Fusionner « ${t.nom} »`, `<p>Ses doléances et leurs soutiens passent dans le thème choisi, puis « ${esc(t.nom)} » est supprimé.</p><div class="field"><label for="merge-to">Fusionner dans</label><select class="select" id="merge-to">${S.themes.filter(x => x.id !== t.id).map(x => `<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select></div>`, cancel + `<button class="btn btn-primary" data-a="confirmMerge">${ic('merge')}Fusionner</button>`); }
    case 'cutUser': { const u = S.admins.find(x => x.id === m.id); const last = activeAdmins().filter(a => a.id !== u.id).length === 0 && u.statut === 'actif';
      if (last) return wrap("Couper l'accès", `<p>${esc(u.nom)} est le dernier admin actif. Invitez d'abord un autre admin.</p>`, `<button class="btn" data-a="closeModal">Fermer</button>`);
      return wrap("Couper l'accès", `<p>${esc(u.nom)} ne pourra plus se connecter et ses appareils sont déconnectés. Ses actions restent dans le journal.</p>`, cancel + `<button class="btn btn-danger" data-a="confirmCutUser">${ic('user-x')}Couper l'accès</button>`); }
  }
  return '';
}

/* ===================== Actions ===================== */
function copy(text, ok){ try { navigator.clipboard.writeText(text).then(() => toast(ok, 'copy')).catch(() => toast('Copie impossible ici : ' + excerpt(text, 60), 'alert-circle')); } catch(e) { toast('Copie impossible ici : ' + excerpt(text, 60), 'alert-circle'); } }
async function handleFile(f){
  if (!f) return;
  if (!/\.docx$/i.test(f.name)){ toast('Choisissez un fichier Word (.docx) téléchargé depuis le Google Doc.', 'alert-circle'); return; }

        const dg = out.tel.replace(/\D/g, '');
        if (S.ceos.some(c => norm(c.entreprise) === norm(out.entreprise))) out.err = 'Déjà dans la liste';
        else if (!dg) out.warn = 'Sans téléphone';
        else if (!out.maillon) out.warn = 'Maillon à préciser';
        else if (!out.nom) out.warn = 'Dirigeant à préciser';
        return out;
      });
      S.modal = {type:'import', raw:'', rows, fileName:file.name}; render();
    } catch(e){ toast("Ce fichier n'a pas pu être lu.", 'alert-circle'); }
  };
  fr.readAsArrayBuffer(file);
}
const IN = {
  search(el){ S.search = el.value; const pos = el.selectionStart; render(); const s = document.querySelector('[data-input="search"]'); if (s){ s.focus(); s.setSelectionRange(pos, pos); } },
  waMsg(el){ S.modal.msg = el.value; const a = document.getElementById('wa-link'); if (a) a.href = waHref(ceoById(S.modal.id).tel, el.value); }
};

/* ===================== Écouteurs ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el){ if (S.menu && !e.target.closest('.menu')){ S.menu = null; render(); } return; }
  if (!A[el.dataset.a]) return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  if (el.disabled) return;
  A[el.dataset.a](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault();
  const email = val('login-email').trim().toLowerCase(); const pw = val('login-pw'); const u = S.admins.find(x => x.email === email);
  if (!pw || !u){ S.loginErr = 'Email ou mot de passe incorrect.'; render(); return; }
  if (!u.acces){ S.loginErr = 'Cet accès a été coupé. Contactez un autre admin.'; render(); return; }
  if (u.statut === 'invite'){ S.loginErr = "Invitation pas encore acceptée : ouvrez l'email reçu pour choisir votre mot de passe."; render(); return; }
  S.loginErr = null; S.auth = true; S.user = u.id; render(); toast('Connecté. Cet appareil reste connecté 30 jours.');
});
document.addEventListener('change', e => {
  if (e.target.id === 'file-in'){ handleFile(e.target.files[0]); return; }
  if (e.target.id === 'xls-in'){ readSheet(e.target.files[0]); return; }
  const k = e.target.dataset && e.target.dataset.change; if (k && CH[k]) CH[k](e.target);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.input; if (k && IN[k]) IN[k](e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (S.modal){ S.modal = null; render(); } else if (S.menu){ S.menu = null; render(); } } });

/* ===================== Démarrage ===================== */
loadMoment('redaction');
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());

</script>
</body>
